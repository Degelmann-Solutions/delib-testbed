[project]
name = "delib-testbed"
version = "0.1.0"
description = "A multi-product life model built from lifelib's delib library, with a real, growing commit history"
readme = "README.md"
license = "MIT"
requires-python = "==3.12.*"
dependencies = [
    "modelx>=0.33.0",
    "numpy>=2",
    "pandas>=3.0.6",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
